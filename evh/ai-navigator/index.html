  var bytes = function(b64s){
    var s = atob(b64s), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  };
  async function unlock(pw){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt: bytes(D.salt), iterations: D.iter, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    // AES-GCM is authenticated: a wrong password throws here rather than
    // returning garbage, so this doubles as the password check.
    var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv: bytes(D.iv) }, key, bytes(D.ct));
    return new TextDecoder().decode(pt);
  }
  function reveal(html){
    document.getElementById("gate").remove();
    var doc = document.getElementById("doc");
    doc.innerHTML = html;
    // innerHTML does not execute <script>, and the proposal's reveal-on-scroll
    // observer lives in one — re-attach it rather than shipping a copy.
    doc.querySelectorAll("script").forEach(function(old){
      var s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    try { sessionStorage.setItem("evh_prop", "1"); } catch(e){}
  }
  var form = document.getElementById("gform");
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var btn = document.getElementById("gbtn"), err = document.getElementById("gerr");
    btn.disabled = true; btn.textContent = "Unlocking…"; err.hidden = true;
    try {
      reveal(await unlock(document.getElementById("gpw").value.trim()));
    } catch(_){
      err.hidden = false; btn.disabled = false; btn.textContent = "Unlock";
      document.getElementById("gpw").select();
    }
  });
})();
